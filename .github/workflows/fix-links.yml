name: Fix NALC links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix broken links in all index pages
        run: |
          find . -type f -name 'index.html' -print0 | xargs -0 sed -i \
            -e 's#https://miaolibrary\.in/nalc\.html#https://miaolibrary.in/nalc/#g' \
            -e 's#href="/nalc\.html"#href="/nalc/"#g' \
            -e 's#https://miaolibrary\.in/Assets/images/nalc-twitter-banner\.jpg#https://miaolibrary.in/nalc/Assets/images/nalc-twitter-banner.jpg#g'
          rm -f .github/workflows/fix-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix broken links after NALC migration"
            git push origin main
          fi
