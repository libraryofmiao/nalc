name: Sync NALC navbar links with footer links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align navbar links with footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          navs = {
              'visit/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Testimonials', 'https://nalc.miaolibrary.in/testimonials/'),
                  ('Founder', 'https://nalc.miaolibrary.in/founder/'),
                  ('Miao Library', 'https://miaolibrary.in/')
              ],
              'testimonials/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Visits', 'https://nalc.miaolibrary.in/visit/'),
                  ('Founder', 'https://nalc.miaolibrary.in/founder/'),
                  ('Miao Library', 'https://miaolibrary.in/')
              ],
              'founder/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Visits', 'https://nalc.miaolibrary.in/visit/'),
                  ('Testimonials', 'https://nalc.miaolibrary.in/testimonials/'),
                  ('Miao Library', 'https://miaolibrary.in/')
              ]
          }

          for file, links in navs.items():
              p = Path(file)
              s = p.read_text(encoding='utf-8')
              replacement = ''.join(f'<a class="nav-link" href="{url}">{label}</a>' for label, url in links)
              pattern = r'<div class="navbar-nav ms-auto align-items-lg-center">.*?</div>'
              new_s, n = re.subn(pattern, f'<div class="navbar-nav ms-auto align-items-lg-center">{replacement}</div>', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Navbar block not found exactly once in {file}')
              p.write_text(new_s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visit/index.html testimonials/index.html founder/index.html
          git rm .github/workflows/sync-navbar-footer-links.yml
          git commit -m "Align NALC navbar links with footer links"
          git push
