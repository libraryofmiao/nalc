name: Apply unified NALC footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    if: github.event.head_commit.message != 'Implement unified three-section NALC footer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace footers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'index.html': [
                  ('Visits', 'visit/index.html'),
                  ('Testimonials', 'visit/testimonials/index.html'),
                  ('Founder', 'visit/testimonials/founder/index.html'),
                  ('Miao Library', 'https://miaolibrary.in/'),
              ],
              'visit/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Testimonials', 'https://nalc.miaolibrary.in/visit/testimonials/index.html'),
                  ('Founder', 'https://nalc.miaolibrary.in/visit/testimonials/founder/index.html'),
                  ('Miao Library', 'https://miaolibrary.in/'),
              ],
              'visit/testimonials/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Visits', 'https://nalc.miaolibrary.in/visit/index.html'),
                  ('Founder', 'https://nalc.miaolibrary.in/visit/testimonials/founder/index.html'),
                  ('Miao Library', 'https://miaolibrary.in/'),
              ],
              'visit/testimonials/founder/index.html': [
                  ('Home', 'https://nalc.miaolibrary.in/'),
                  ('Visits', 'https://nalc.miaolibrary.in/visit/index.html'),
                  ('Testimonials', 'https://nalc.miaolibrary.in/visit/testimonials/index.html'),
                  ('Miao Library', 'https://miaolibrary.in/'),
              ],
          }

          css = '''
          .nalc-footer-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2rem;align-items:start;text-align:left}
          .nalc-footer-col{min-width:0}
          .nalc-footer-title{font-size:1rem;font-weight:800;letter-spacing:.04em;margin:0 0 .75rem;color:#fff}
          .nalc-footer-address,.nalc-footer-copy{margin:0;line-height:1.65;opacity:.9}
          .nalc-footer-links{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}
          .nalc-footer-links a{color:#fff;font-weight:700}
          .nalc-footer-links a:hover{text-decoration:underline}
          .nalc-footer-right{text-align:right}
          @media(max-width:767px){.nalc-footer-grid{grid-template-columns:1fr;gap:1.75rem}.nalc-footer-right{text-align:left}}
          '''

          for filename, links in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '.nalc-footer-grid{' not in text:
                  text = text.replace('</style>', css + '\n  </style>', 1)

              link_html = '\n'.join(f'          <a href="{href}">{label}</a>' for label, href in links)
              footer = f'''  <footer>
    <div class="container">
      <div class="nalc-footer-grid">
        <div class="nalc-footer-col">
          <p class="nalc-footer-title">New Age Learning Centre</p>
          <p class="nalc-footer-address">Miao Sub-Division, Changlang District,<br>Arunachal Pradesh</p>
        </div>
        <div class="nalc-footer-col">
          <p class="nalc-footer-title">Quick Links</p>
          <nav class="nalc-footer-links" aria-label="Footer quick links">
{link_html}
          </nav>
        </div>
        <div class="nalc-footer-col nalc-footer-right">
          <p class="nalc-footer-copy">© 2026 Sub Divisional Library Miao<br>Changlang District, Arunachal Pradesh</p>
        </div>
      </div>
    </div>
  </footer>'''

              new_text, count = re.subn(r'\s*<footer\b[^>]*>.*?</footer>', '\n\n' + footer, text, count=1, flags=re.S|re.I)
              if count != 1:
                  raise SystemExit(f'Footer not found in {filename}')
              path.write_text(new_text, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = ['index.html','visit/index.html','visit/testimonials/index.html','visit/testimonials/founder/index.html']
          for f in files:
              text = Path(f).read_text(encoding='utf-8')
              assert text.count('<footer>') == 1, f'{f}: footer count'
              assert text.count('</footer>') == 1, f'{f}: footer close count'
              assert 'New Age Learning Centre' in text
              assert 'Miao Sub-Division, Changlang District' in text
              assert '© 2026 Sub Divisional Library Miao' in text
              assert 'https://miaolibrary.in/' in text
              assert re.search(r'<nav class="nalc-footer-links"[^>]*>.*?Miao Library.*?</nav>', text, re.S), f'{f}: Miao Library link missing'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html visit/index.html visit/testimonials/index.html visit/testimonials/founder/index.html
          git rm .github/workflows/temporary-footer-update.yml
          git commit -m 'Implement unified three-section NALC footer'
          git push
