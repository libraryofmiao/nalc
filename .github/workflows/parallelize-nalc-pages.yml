name: Parallelize NALC pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  move:
    if: github.event.head_commit.message != 'Parallelize NALC pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move pages and correct paths only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testimonials founder
          git mv visit/testimonials/index.html testimonials/index.html
          git mv visit/testimonials/images testimonials/images
          git mv visit/testimonials/founder founder
          rmdir visit/testimonials
          for f in index.html visit/index.html testimonials/index.html founder/index.html sitemap.xml visit/README.md; do
            [ -f "$f" ] || continue
            python - "$f" <<'PY'
import pathlib, sys
p=pathlib.Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
repls={
 'visit/testimonials/founder/index.html':'founder/index.html',
 'visit/testimonials/index.html':'testimonials/index.html',
 'https://nalc.miaolibrary.in/visit/testimonials/founder/':'https://nalc.miaolibrary.in/founder/',
 'https://nalc.miaolibrary.in/visit/testimonials/founder/index.html':'https://nalc.miaolibrary.in/founder/index.html',
 'https://nalc.miaolibrary.in/visit/testimonials/':'https://nalc.miaolibrary.in/testimonials/',
 'https://nalc.miaolibrary.in/visit/testimonials/index.html':'https://nalc.miaolibrary.in/testimonials/index.html',
 '../../../Assets/':'../Assets/',
 '../../Assets/':'../Assets/'
}
for a,b in repls.items(): s=s.replace(a,b)
p.write_text(s,encoding='utf-8')
PY
          done
          rm .github/workflows/parallelize-nalc-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Parallelize NALC pages'
          git push origin main
