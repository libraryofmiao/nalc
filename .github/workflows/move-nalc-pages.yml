name: Move NALC pages
"on":
  push:
    branches:
      - work-nalc-parallel-move-2026-09-13
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move folders and correct paths only
        shell: bash
        run: |
          set -euo pipefail
          git mv visit/testimonials testimonials
          git mv testimonials/founder founder

          python - <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          replace('index.html', [
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/', 'https://nalc.miaolibrary.in/founder/'),
              ('https://nalc.miaolibrary.in/visit/testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/', 'https://nalc.miaolibrary.in/testimonials/'),
              ('visit/testimonials/founder/index.html', 'founder/index.html'),
              ('visit/testimonials/index.html', 'testimonials/index.html'),
          ])

          replace('visit/index.html', [
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/', 'https://nalc.miaolibrary.in/founder/'),
              ('https://nalc.miaolibrary.in/visit/testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/', 'https://nalc.miaolibrary.in/testimonials/'),
              ('testimonials/founder/index.html', '../founder/index.html'),
              ('testimonials/index.html', '../testimonials/index.html'),
          ])

          replace('testimonials/index.html', [
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/', 'https://nalc.miaolibrary.in/founder/'),
              ('https://nalc.miaolibrary.in/visit/testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/', 'https://nalc.miaolibrary.in/testimonials/'),
              ('../../Assets/images/logo.png', '../Assets/images/logo.png'),
              ('founder/index.html', '../founder/index.html'),
              ('../index.html">Visits', '../visit/index.html">Visits'),
          ])

          replace('founder/index.html', [
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html'),
              ('https://nalc.miaolibrary.in/visit/testimonials/founder/', 'https://nalc.miaolibrary.in/founder/'),
              ('../../../Assets/images/logo.png', '../Assets/images/logo.png'),
              ('../../../index.html">Home', '../index.html">Home'),
              ('../../index.html">Visits', '../visit/index.html">Visits'),
              ('../index.html">Testimonials', '../testimonials/index.html">Testimonials'),
          ])

          if Path('sitemap.xml').exists():
              replace('sitemap.xml', [
                  ('https://nalc.miaolibrary.in/visit/testimonials/founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html'),
                  ('https://nalc.miaolibrary.in/visit/testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/index.html'),
                  ('https://nalc.miaolibrary.in/visit/testimonials/founder/', 'https://nalc.miaolibrary.in/founder/'),
                  ('https://nalc.miaolibrary.in/visit/testimonials/', 'https://nalc.miaolibrary.in/testimonials/'),
              ])

          if Path('visit/README.md').exists():
              replace('visit/README.md', [
                  ('visit/testimonials/founder/index.html', 'founder/index.html'),
                  ('visit/testimonials/index.html', 'testimonials/index.html'),
              ])
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Parallelize NALC pages'
          git push origin HEAD:work-nalc-parallel-move-2026-09-13

          rm .github/workflows/move-nalc-pages.yml
          git add .github/workflows/move-nalc-pages.yml
          git commit -m 'Remove temporary NALC move workflow'
          git push origin HEAD:work-nalc-parallel-move-2026-09-13
