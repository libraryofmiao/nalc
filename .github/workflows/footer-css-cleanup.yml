name: Clean up legacy footer CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only obsolete footer CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
            Path('index.html'),
            Path('visit/index.html'),
            Path('visit/testimonials/index.html'),
            Path('visit/testimonials/founder/index.html'),
          ]

          legacy = re.compile(r'\.footer-links\{display:flex;justify-content:center;flex-wrap:wrap;gap:\.5rem 1\.5rem\}\.footer-links a\{color:#fff;font-weight:700\}\.footer-links a:hover\{text-decoration:underline\}\.footer-meta\{opacity:\.85;margin-top:1\.5rem\}')

          for p in files:
            text = p.read_text(encoding='utf-8')
            new, n = legacy.subn('', text, count=1)
            if n != 1:
              raise SystemExit(f'Expected exactly one legacy footer CSS block in {p}, found {n}')
            p.write_text(new, encoding='utf-8')

          print('Removed exactly one obsolete footer CSS block from each of the four target files.')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html visit/index.html visit/testimonials/index.html visit/testimonials/founder/index.html
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Remove legacy footer CSS"
          git push
