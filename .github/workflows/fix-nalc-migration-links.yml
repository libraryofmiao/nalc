name: Fix NALC migration links
"on":
  push:
    branches:
      - work-nalc-parallel-move-2026-09-13
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct only malformed migration URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for p in [Path('index.html'), Path('visit/index.html'), Path('testimonials/index.html'), Path('founder/index.html'), Path('sitemap.xml')]:
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('https://nalc.miaolibrary.in/../testimonials/', 'https://nalc.miaolibrary.in/testimonials/')
              s=s.replace('https://nalc.miaolibrary.in/../testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/index.html')
              s=s.replace('https://nalc.miaolibrary.in/../founder/', 'https://nalc.miaolibrary.in/founder/')
              s=s.replace('https://nalc.miaolibrary.in/../founder/index.html', 'https://nalc.miaolibrary.in/founder/index.html')
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix NALC migration links'
          git push origin HEAD:work-nalc-parallel-move-2026-09-13
          rm .github/workflows/fix-nalc-migration-links.yml
          git add .github/workflows/fix-nalc-migration-links.yml
          git commit -m 'Remove temporary link-fix workflow'
          git push origin HEAD:work-nalc-parallel-move-2026-09-13
