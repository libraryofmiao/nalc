name: Normalize NALC metadata paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize URLs only
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'https://nalc.miaolibrary.in/visit/index.html': 'https://nalc.miaolibrary.in/visit/',
              'https://nalc.miaolibrary.in/testimonials/index.html': 'https://nalc.miaolibrary.in/testimonials/',
              'https://nalc.miaolibrary.in/founder/index.html': 'https://nalc.miaolibrary.in/founder/',
              'href="../index.html"': 'href="../"',
              'href="../visit/index.html"': 'href="../visit/"',
              'href="../testimonials/index.html"': 'href="../testimonials/"',
              'href="../founder/index.html"': 'href="../founder/"',
              'href="visit/index.html"': 'href="visit/"',
              'href="testimonials/index.html"': 'href="testimonials/"',
              'href="founder/index.html"': 'href="founder/"',
          }

          for path in [Path('index.html'), Path('visit/index.html'), Path('testimonials/index.html'), Path('founder/index.html')]:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          text = text.replace('https://nalc.miaolibrary.in/visit/index.html', 'https://nalc.miaolibrary.in/visit/')
          text = text.replace('https://nalc.miaolibrary.in/testimonials/index.html', 'https://nalc.miaolibrary.in/testimonials/')
          text = text.replace('https://nalc.miaolibrary.in/founder/index.html', 'https://nalc.miaolibrary.in/founder/')
          sitemap.write_text(text, encoding='utf-8')
          PY

      - name: Commit metadata/path normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html visit/index.html testimonials/index.html founder/index.html sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Normalize NALC metadata URLs to parallel paths"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/normalize-metadata-paths.yml
          git commit -m "Remove temporary metadata normalization workflow"
          git push
