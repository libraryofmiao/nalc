name: Import NALC website

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import NALC files
        run: |
          git clone --depth 1 https://github.com/libraryofmiao/libraryofmiao.github.io.git /tmp/libraryofmiao.github.io
          cp -a /tmp/libraryofmiao.github.io/nalc/. ./
          rm -f .github/workflows/import-nalc.yml

      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Move NALC website into dedicated repository"
            git push origin main
          fi
